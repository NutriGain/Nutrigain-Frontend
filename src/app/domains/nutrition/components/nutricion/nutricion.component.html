<div class="floating-elements">
  <div class="floating-element"></div>
  <div class="floating-element"></div>
  <div class="floating-element"></div>
  <div class="floating-element"></div>
</div>

<button class="back-button" (click)="volver()">
  ← Volver
</button>

<div class="container">
  <div class="header">
    <h1>🍽️ Plan Nutricional</h1>
    <p>Tu guía semanal personalizada para una alimentación balanceada</p>
  </div>

  <p *ngIf="error">{{ error }}</p>

  <div class="days-grid" *ngIf="plan">
    <div class="day-card" *ngFor="let day of plan.days">
      <div class="day-header">
        <div class="day-name">{{ diaEs(day.dayOfWeek) }}</div>
      </div>
      <div class="meal" *ngFor="let item of day.meals">
        <img [src]="item.meal.imageUrl" [alt]="item.meal.name" class="meal-image">
        <div class="meal-content">
          <div class="meal-type">
            <span class="meal-icon">{{ icono(item.mealType) }}</span>
            {{ tipoEs(item.mealType) }}
          </div>
          <div class="meal-description">{{ item.meal.name }}</div>
          <div class="meal-calories">{{ item.meal.calories }} cal • {{ item.meal.proteins }}g proteína</div>
        </div>
      </div>
    </div>
  </div>
</div>
