<mat-card class="main-card">
  <div class="card-header">
    <div>
      <h3>Bodyweight</h3>
    </div>
    <div class="card-subtitle">Statistics</div>
  </div>

  <div class="responsive-chart-container">
    <ngx-charts-line-chart
      [view]="view"
      [scheme]="colorScheme"
      [results]="data"
      [xAxis]="true"
      [yAxis]="true"
      [legend]="false"
      [showXAxisLabel]="true"
      [xAxisLabel]="'Fecha'"
      [showYAxisLabel]="true"
      [yAxisLabel]="'Peso (kg)'"
      [autoScale]="true"
      [animations]="true">
    </ngx-charts-line-chart>
  </div>

  <form class="weight-form" (ngSubmit)="registrarPeso()">
    <input type="number" step="0.1" min="20" max="500" name="peso" placeholder="Tu peso de hoy (kg)"
           [(ngModel)]="nuevoPeso" />
    <button type="submit" [disabled]="nuevoPeso === null">Registrar</button>
    <span class="weight-error" *ngIf="error">{{ error }}</span>
  </form>
</mat-card>
