<div class="dashboard-container">
  <!-- Header -->
  <div class="header">
    <h1>Dashboard</h1>
    <button mat-icon-button [matMenuTriggerFor]="menu" class="notification-icon">
      <mat-icon [matBadge]="sinLeer" [matBadgeHidden]="sinLeer === 0" matBadgeColor="warn" matBadgeSize="small">notifications</mat-icon>
    </button>
    <mat-menu #menu="matMenu">
      <div class="notif-empty" *ngIf="notificaciones.length === 0" style="padding: 8px 16px;">Sin notificaciones</div>
      <div *ngFor="let n of notificaciones" style="padding: 6px 16px; max-width: 280px;" [style.opacity]="n.seen ? 0.6 : 1">
        <strong>{{ n.title }}</strong><br>
        <small>{{ n.message }}</small>
      </div>
      <button mat-menu-item *ngIf="sinLeer > 0" (click)="marcarTodasComoLeidas()">
        <mat-icon>done_all</mat-icon>
        <span>Marcar todas como leídas</span>
      </button>
      <mat-divider></mat-divider>
      <button mat-menu-item (click)="navigateTo('/perfil')">
        <mat-icon>person</mat-icon>
        <span>Perfil</span>
      </button>
      <button mat-menu-item (click)="navigateTo('/logros')">
        <mat-icon>military_tech</mat-icon>
        <span>Logros</span>
      </button>
      <button mat-menu-item (click)="navigateTo('/ranking')">
        <mat-icon>leaderboard</mat-icon>
        <span>Ranking</span>
      </button>
      <button mat-menu-item (click)="logout()">
        <mat-icon>logout</mat-icon>
        <span>Cerrar sesión</span>
      </button>
    </mat-menu>
  </div>

  <!-- Contenido principal -->
  <div class="main-content">
    <!-- Bodyweight chart (lado izquierdo) -->
    <div>
      <app-bodyweight-card></app-bodyweight-card>
    </div>

    <!-- Stats y Challenge (lado derecho) -->
    <div>
      <app-streak-card class="animate-delay-1"></app-streak-card>
      <app-reto-card class="animate-delay-2"></app-reto-card>
    </div>
  </div>

  <!-- Sección inferior -->
  <div class="bottom-section">
    <!-- Progreso -->
    <app-progreso-card class="animate-delay-4"></app-progreso-card>

    <!-- Frase del día -->
    <app-frase-card class="animate-delay-5"></app-frase-card>

    <!-- Avatar -->
    <app-avatar-card class="animate-delay-6"></app-avatar-card>
  </div>

  <!-- Navegación inferior -->
  <app-bottom-navbar></app-bottom-navbar>
</div>
